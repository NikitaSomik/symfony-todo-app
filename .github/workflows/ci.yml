name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: todo_app
          POSTGRES_USER: todo_app
          POSTGRES_PASSWORD: secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://todo_app:secret@127.0.0.1:5432/todo_app?serverVersion=18&charset=utf8

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, xml, ctype, json, pdo, pdo_pgsql
          coverage: none

      - name: Cache Composer packages
        uses: actions/cache@v6
        with:
          path: vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Check code style
        run: vendor/bin/php-cs-fixer fix --dry-run --diff

      - name: Warm up cache
        run: php bin/console cache:warmup

      # Checks the arguments of every service definition against the constructor types, so a
      # wrong service wired by hand fails here, not with a TypeError the first time it is built.
      # Prod is linted too: no test builds its container.
      - name: Lint service container
        run: |
          php bin/console lint:container
          php bin/console lint:container --env=prod

      - name: Run PHPStan
        run: vendor/bin/phpstan analyse --no-progress

      - name: Create test database
        run: php bin/console doctrine:database:create --env=test --if-not-exists

      - name: Run migrations
        run: php bin/console doctrine:migrations:migrate --no-interaction --env=test

      - name: Validate schema
        run: php bin/console doctrine:schema:validate --env=test

      - name: Run tests
        run: vendor/bin/phpunit
