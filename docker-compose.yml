name: todo-app

services:
  app:
    build:
      context: ./docker/php
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    working_dir: /var/www/app
    restart: unless-stopped
    volumes:
      - ./:/var/www/app
      - ./docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini
    environment:
      XDEBUG_CONFIG: "client_host=host.docker.internal"
      PHP_IDE_CONFIG: "serverName=todo-app"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - todo-app-network

  worker:
    extends:
      service: app
    command: ["php", "bin/console", "messenger:consume", "async", "--time-limit=3600", "--memory-limit=128M"]
    environment:
      XDEBUG_MODE: "off"

  nginx:
    image: nginx:alpine
    working_dir: /var/www/app
    restart: unless-stopped
    ports:
      - "127.0.0.1:80:80"
    volumes:
      - ./:/var/www/app
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - todo-app-network

  meet:
    build: ../go-meet-service
    profiles: ["meet"]
    restart: unless-stopped
    env_file:
      - path: .env.meet.local
        required: false
    environment:
      LISTEN_ADDR: ":8080"
      DATABASE_URL: postgres://meet:secret@db:5432/meet?sslmode=disable
      MONOLITH_URL: http://nginx:8080
      LIVEKIT_URL: http://livekit:7880
      LIVEKIT_PUBLIC_URL: ws://127.0.0.1:7880
      LIVEKIT_API_KEY: devkey
      LIVEKIT_API_SECRET: secret
    depends_on:
      meet-migrate:
        condition: service_completed_successfully
    networks:
      - todo-app-network

  meet-migrate:
    build: ../go-meet-service
    profiles: ["meet"]
    command: ["migrate"]
    environment:
      DATABASE_URL: postgres://meet:secret@db:5432/meet?sslmode=disable
    depends_on:
      meet-database:
        condition: service_completed_successfully
    networks:
      - todo-app-network

  meet-database:
    image: postgres:18-alpine
    profiles: ["meet"]
    command: ["psql", "--host=db", "--username=${POSTGRES_USER}", "--dbname=${POSTGRES_DB}", "--set=ON_ERROR_STOP=1", "--file=/create-meet-database.sql"]
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./docker/postgres/create-meet-database.sql:/create-meet-database.sql:ro
    depends_on:
      db:
        condition: service_healthy
    networks:
      - todo-app-network

  livekit:
    image: livekit/livekit-server:v1.13.11
    profiles: ["meet"]
    restart: unless-stopped
    command: --dev --bind 0.0.0.0 --node-ip 127.0.0.1
    environment:
      LIVEKIT_CONFIG: |
        room:
          auto_create: false
        webhook:
          api_key: devkey
          urls:
            - http://meet:8080/internal/v1/livekit/webhook
    ports:
      - "127.0.0.1:7880:7880"
      - "127.0.0.1:7881:7881"
      - "127.0.0.1:7882:7882/udp"
    networks:
      - todo-app-network

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - todo-app-network

  rabbitmq:
    image: rabbitmq:4.2-management-alpine
    hostname: rabbitmq
    restart: unless-stopped
    ports:
      - "127.0.0.1:${RABBITMQ_MANAGEMENT_HOST_PORT:-15672}:15672"
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "5672"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - todo-app-network

  mailpit:
    image: axllent/mailpit:v1.29.3
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MAILPIT_HOST_PORT:-8025}:8025"
    networks:
      - todo-app-network

  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - db_data:/var/lib/postgresql
      - ./docker/postgres/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U todo_app -d todo_app"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - todo-app-network

volumes:
  db_data:
  rabbitmq_data:

networks:
  todo-app-network:
    driver: bridge