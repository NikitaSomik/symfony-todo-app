name: todo-app

services:
  app:
    build:
      context: ./docker/php
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    working_dir: /var/www/app
    restart: unless-stopped
    volumes:
      - ./:/var/www/app
      - ./docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini
    environment:
      XDEBUG_CONFIG: "client_host=host.docker.internal"
      PHP_IDE_CONFIG: "serverName=todo-app"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - todo-app-network

  worker:
    extends:
      service: app
    command: ["php", "bin/console", "messenger:consume", "async", "--time-limit=3600", "--memory-limit=128M"]
    environment:
      XDEBUG_MODE: "off"

  nginx:
    image: nginx:alpine
    working_dir: /var/www/app
    restart: unless-stopped
    ports:
      - "127.0.0.1:80:80"
    volumes:
      - ./:/var/www/app
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - todo-app-network

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - todo-app-network

  rabbitmq:
    image: rabbitmq:4.2-management-alpine
    hostname: rabbitmq
    restart: unless-stopped
    ports:
      - "127.0.0.1:${RABBITMQ_MANAGEMENT_HOST_PORT:-15672}:15672"
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "5672"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - todo-app-network

  mailpit:
    image: axllent/mailpit:v1.29.3
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MAILPIT_HOST_PORT:-8025}:8025"
    networks:
      - todo-app-network

  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - db_data:/var/lib/postgresql
      - ./docker/postgres/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U todo_app -d todo_app"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - todo-app-network

volumes:
  db_data:
  rabbitmq_data:

networks:
  todo-app-network:
    driver: bridge