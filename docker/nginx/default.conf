server {
    listen 80;
    # Not published by compose: the port on which other services of the private network
    # reach /internal.
    listen 8080;
    server_name localhost;

    root /var/www/app/public;
    index index.php index.html;

    # Docker's DNS, asked at each request: nginx starts without Meet and finds it again
    # after a restart gives it another address.
    resolver 127.0.0.11 valid=10s;

    # Browsers must trust Content-Type instead of guessing it; "always" covers error responses too.
    add_header X-Content-Type-Options nosniff always;

    location / {
        try_files $uri /index.php$is_args$args;
    }

    location ~ ^/api/v1/meetings(/|$) {
        set $meet http://meet:8080;
        proxy_pass $meet;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/internal(/|$) {
        if ($server_port != 8080) {
            return 404;
        }
        try_files $uri /index.php$is_args$args;
    }

    location ~ ^/index\.php(/|$) {
        fastcgi_pass app:9000;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_read_timeout 75s;
        internal;
    }

    location ~ \.php$ {
        return 404;
    }
}
