when@dev:
    nelmio_api_doc:
        documentation:
            info:
                title: Todo API
                description: Todo application REST API
                version: 1.0.0
            components:
                securitySchemes:
                    cookieAuth:
                        type: apiKey
                        in: cookie
                        name: access_token
                        description: JWT access token stored in an HttpOnly cookie. Obtained via POST /api/v1/auth/login.
                responses:
                    UnauthorizedError:
                        description: Unauthorized — valid access_token cookie required
                        content:
                            application/json:
                                schema:
                                    type: object
                                    properties:
                                        errors:
                                            type: array
                                            items:
                                                type: object
                                                properties:
                                                    status:
                                                        type: string
                                                        example: '401'
                                                    detail:
                                                        type: string
                                                        example: Unauthorized.
                    ValidationError:
                        description: Validation error
                        content:
                            application/json:
                                schema:
                                    type: object
                                    properties:
                                        errors:
                                            type: array
                                            items:
                                                type: object
                                                properties:
                                                    status:
                                                        type: string
                                                        example: '422'
                                                    detail:
                                                        type: string
                                                        example: This value is not a valid email address.
                                                    source:
                                                        type: object
                                                        description: 'One of: "pointer" for a value in the request body, "parameter" for a query parameter.'
                                                        properties:
                                                            pointer:
                                                                type: string
                                                                example: /email
                                                            parameter:
                                                                type: string
                                                                example: filter[due_to]
            security:
                - cookieAuth: []
        areas:
            path_patterns:
                - ^/api/v1
