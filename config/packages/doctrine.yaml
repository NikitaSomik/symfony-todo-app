doctrine:
    dbal:
        url: '%env(resolve:DATABASE_URL)%'

        server_version: '18'

        profiling_collect_backtrace: '%kernel.debug%'

        types:
            tsvector: MartinGeorgiev\Doctrine\DBAL\Types\Tsvector

        mapping_types:
            tsvector: !php/const MartinGeorgiev\Doctrine\DBAL\Type::TSVECTOR
    orm:
        validate_xml_mapping: true
        naming_strategy: doctrine.orm.naming_strategy.underscore
        identity_generation_preferences:
            Doctrine\DBAL\Platforms\PostgreSQLPlatform: identity
        auto_mapping: true
        # Only entity directories: the rest of src/ holds code that must not be reflected
        # in prod, e.g. fixtures built on dev-only packages.
        mappings:
            Auth:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Auth/Entity'
                prefix: 'App\Auth\Entity'
            Task:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Task/Entity'
                prefix: 'App\Task\Entity'
            AuditLog:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/AuditLog/Entity'
                prefix: 'App\AuditLog\Entity'
        dql:
            string_functions:
                TSMATCH: MartinGeorgiev\Doctrine\ORM\Query\AST\Functions\Tsmatch
                TS_RANK_CD: MartinGeorgiev\Doctrine\ORM\Query\AST\Functions\TsRankCd
                WEBSEARCH_TO_TSQUERY: MartinGeorgiev\Doctrine\ORM\Query\AST\Functions\WebsearchToTsquery

when@test:
    doctrine:
        dbal:
            # "TEST_TOKEN" is typically set by ParaTest
            dbname_suffix: '_test%env(default::TEST_TOKEN)%'

when@prod:
    doctrine:
        orm:
            query_cache_driver:
                type: pool
                pool: doctrine.system_cache_pool
            result_cache_driver:
                type: pool
                pool: doctrine.result_cache_pool

    framework:
        cache:
            pools:
                doctrine.result_cache_pool:
                    adapter: cache.app
                doctrine.system_cache_pool:
                    adapter: cache.system
