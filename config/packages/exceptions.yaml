framework:
    # Maps domain exceptions to HTTP statuses here, so that the modules themselves stay free
    # of HTTP concerns. Order matters: the first class matching "instanceof" wins.
    exceptions:
        App\Auth\Exception\EmailAlreadyTakenException:
            status_code: 409
            log_level: info
        App\Auth\Exception\InvalidRefreshTokenException:
            status_code: 401
            log_level: info
        Symfony\Component\Workflow\Exception\NotEnabledTransitionException:
            status_code: 409
            log_level: info
        # Client errors raised by Symfony itself keep their status. They are the client's to
        # fix, not incidents: without this they are logged as errors and flush the prod buffer.
        Symfony\Component\HttpKernel\Exception\BadRequestHttpException: { log_level: info }
        Symfony\Component\HttpKernel\Exception\NotFoundHttpException: { log_level: info }
        Symfony\Component\HttpKernel\Exception\MethodNotAllowedHttpException: { log_level: info }
        Symfony\Component\HttpKernel\Exception\UnsupportedMediaTypeHttpException: { log_level: info }
        Symfony\Component\HttpKernel\Exception\UnprocessableEntityHttpException: { log_level: info }
        Symfony\Component\HttpKernel\Exception\TooManyRequestsHttpException: { log_level: info }
