when@dev: &dev
    zenstruck_foundry:
        enable_auto_refresh_with_lazy_objects: true
        persistence:
            flush_once: true

    services:
        App\Fixtures\:
            resource: '%kernel.project_dir%/fixtures/'
            autowire: true
            autoconfigure: true

when@test:
    zenstruck_foundry:
        enable_auto_refresh_with_lazy_objects: true
        orm:
            reset:
                mode: migrate

        persistence:
            flush_once: true

    services:
        App\Fixtures\:
            resource: '%kernel.project_dir%/fixtures/'
            autowire: true
            autoconfigure: true
