security:
    password_hashers:
        App\Auth\Entity\User: 'auto'

    providers:
        app_users:
            entity:
                class: App\Auth\Entity\User
                property: email

    firewalls:
        dev:
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false

        # No JWT authenticator here: login/register/refresh/logout never need an access token,
        # and a stale access_token cookie must not block them. Logout still blocklists a valid
        # access token: Lexik's logout listener reads it from the request itself.
        auth:
            pattern: ^/api/v1/auth
            stateless: true
            provider: app_users
            entry_point: App\Auth\Security\Authentication\EntryPoint\ApiAuthenticationEntryPoint
            access_denied_handler: App\Auth\Security\Authorization\ApiAccessDeniedHandler
            json_login:
                check_path: api_auth_login
                username_path: email
                password_path: password
                success_handler: lexik_jwt_authentication.handler.authentication_success
                failure_handler: App\Auth\Security\Authentication\Lexik\AuthenticationFailureHandler
            # Counted per "email + IP" and, with a 5x higher limit, per IP alone:
            # a victim's account cannot be locked from another IP.
            login_throttling:
                max_attempts: 5
                interval: '1 minute'
            logout:
                path: api_auth_logout

        api:
            pattern: ^/api
            stateless: true
            provider: app_users
            entry_point: App\Auth\Security\Authentication\EntryPoint\ApiAuthenticationEntryPoint
            access_denied_handler: App\Auth\Security\Authorization\ApiAccessDeniedHandler
            jwt: ~

    access_control:
        - { path: ^/api/v1/auth, roles: PUBLIC_ACCESS }
        - { path: ^/api/v1,      roles: IS_AUTHENTICATED_FULLY }

when@test:
    security:
        password_hashers:
            App\Auth\Entity\User:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10

when@dev:
    security:
        password_hashers:
            App\Auth\Entity\User:
                algorithm: bcrypt
                cost: 12
