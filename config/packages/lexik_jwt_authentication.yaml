lexik_jwt_authentication:
    secret_key: '%env(JWT_SECRET)%'
    public_key: ~
    pass_phrase: ~
    encoder:
        signature_algorithm: HS256
    token_ttl: 3600
    token_extractors:
        authorization_header:
            enabled: false
        cookie:
            enabled: true
            name: jwt_token
    set_cookies:
        jwt_token:
            lifetime: 3600
            samesite: strict
            path: /
            domain: ~
            secure: false
            httpOnly: true

when@prod:
    lexik_jwt_authentication:
        set_cookies:
            jwt_token:
                secure: true