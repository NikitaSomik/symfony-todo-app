lexik_jwt_authentication:
    secret_key: '%env(resolve:JWT_SECRET_KEY)%'
    public_key: '%env(resolve:JWT_PUBLIC_KEY)%'
    pass_phrase: ''
    encoder:
        signature_algorithm: RS256
    token_ttl: '%app.jwt_ttl%'
    user_id_claim: sub
    blocklist_token:
        enabled: true
        cache: cache.app
    token_extractors:
        authorization_header:
            enabled: false
        cookie:
            enabled: true
            name: access_token
    set_cookies:
        access_token:
            samesite: strict
            path: /
            domain: ~
            secure: false
            httpOnly: true

when@prod:
    lexik_jwt_authentication:
        set_cookies:
            access_token:
                secure: true
